<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Practice</title>
  <style>
    #change-btn {
        padding: 10px;
        border-radius: 8px;
        align-items: center;
        border: 2px solid grey;
        margin: 10px auto;
        width: 80%;
    }
    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border: 2px solid pink;
        margin: 20px auto;
        padding: 10px auto;
        max-width: 1100px;
    }
    main {
      display: flex;
      flex-wrap: wrap;
    }

    .box {
        border: 2px solid black;
        padding: 20px;
        margin: 20px;
    }
    p {
      margin: 10px;
    }

    #user-input {
      padding: 10px;
      height: 10px;
     
    }
    #submit-btn {
      height: 10px;
      padding: 15px;
      text-align: center;
    }

    @media (min-width: 768px) {
        .box {
        border: 2px solid black;
        padding: 20px;
        flex-direction: row;
    }
    }
  </style>
</head>
<body id="body">
  <main>
  <h1 id="greeting">Hello!</h1>
  <button id="change-btn">Change Greeting</button>

  <input type="text" id="user-input" placeholder="Type something...">
  <button id="submit-btn">Submit</button>
  <p id="output">Nothing submitted yet.</p>


  <div class="box">Box 1</div>
  <div class="box">Box 2</div>
  <div class="box">Box 3</div>

  <div class="box">
  <h2>Guest Counter</h2>
  <p>Guests: <span id="count">0</span></p>
  <button id="count-up">+ Add Guest</button>
  <button id="remove-guest">- Remove Guest</button>
  <p id="counter-message"></p>
 </div>

 <div class="box">
  <h2>Color Switcher</h2>
  <button id="red-btn">Red</button>
  <button id="blue-btn">Blue</button>
  <button id="green-btn">Green</button>
  <button id="reset-btn">Reset</button>
  <div id="color-box" style="width: 100%; height: 100px; margin-top: 10px; background-color: lightgray;"></div>
  <p id="color-label">No color selected.</p>
</div>

 
  </main>
   <script src="practice.js"></script>
</body>
</html>
